mail:
  verification:
    subject: "Подтверждение регистрации"
    message: "Перейдите по ссылке ниже, чтобы подтвердить электронную почту: \n%s"
    template: "%s/confirm-email?token=%s"
  appointment:
    reminder:
      subject: "Напоминание о приёме у врача"
      body: "Напоминаем вам о приёме у врача %s %s"
  password:
    reset:
      subject: "Сброс пароля"
      message: "Перейдите по ссылке, чтобы сбросить пароль: %s\n\nЕсли Вы не запрашивали сброс пароля, то проигнорируйте это письмо."
      template: "%s/reset-password?token=%s"
  doctor:
    application:
      subject: "Заявка на регистрацию получена"
      message: "Уважаемый(ая) %s, ваша заявка на регистрацию в системе принята. Мы проверим ваши документы и сообщим о решении по email."
    approved:
      subject: "Заявка одобрена — добро пожаловать"
      message: "Уважаемый(ая) %s, ваша заявка на регистрацию в системе одобрена. Теперь вы можете войти в систему."
    rejected:
      subject: "Заявка отклонена"
      message: "Уважаемый(ая) %s, к сожалению, ваша заявка на регистрацию в системе отклонена.\n\nПричина: %s"
