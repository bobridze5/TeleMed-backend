spring.application.name=TeleMed-backend

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.max-lifetime=600000
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

application.secret=${SECRET_KEY}
application.access.lifetimeMs=900000
application.refresh.lifetimeMs=8640000000

spring.redis.host=redis
spring.redis.port=6379

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${EMAIL_APPLICATION_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connection-timeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.write-timeout=5000

spring.output.ansi.enabled=ALWAYS

spring.config.import=optional:classpath:mail.yaml

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Spring и Jackson форматы даты
# Jackson: JSR-310 (LocalDate/LocalDateTime) сериализовать как ISO-строки.
# Важно: все entity используют LocalDateTime без TZ — фронт и бэкенд
# должны договориться о TZ (сейчас предполагается Europe/Moscow на обеих).
# Миграция на Instant/OffsetDateTime — см. issues #5, #17.
spring.jackson.serialization.write-dates-as-timestamps=false